name: Release

on:
  push:
    branches: [ main ]      # every merge to main -> tag + build + release
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version e.g. 0.2.0 (default: auto patch-bump from latest release)'
        required: false

permissions:
  contents: write           # create tags + releases

concurrency:
  group: release            # serialize releases so version bumps don't collide
  cancel-in-progress: false

jobs:
  release:
    name: Build + tag + release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Determine version (explicit input, else auto patch-bump)
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $latest = ""
            try {
              $resp = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>$null
              if ($resp) { $latest = $resp }
            } catch {}
            if (-not $latest) {
              try {
                $resp = gh api "repos/strepto42/virtual-ac3-encoder/releases/latest" --jq '.tag_name' 2>$null
                if ($resp) { $latest = $resp }
              } catch {}
            }
            if ($latest -match '^v?(\d+)\.(\d+)\.(\d+)') {
              $ver = '{0}.{1}.{2}' -f $Matches[1], $Matches[2], ([int]$Matches[3] + 1)
            } else {
              $ver = '0.2.0'
            }
          }
          $global:LASTEXITCODE = 0
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $ver"

      - name: Cache FFmpeg dev libs
        id: ffcache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Configure + build (Release)
        shell: pwsh
        run: |
          cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64 "-DVAC3_VERSION=${{ steps.ver.outputs.version }}"
          cmake --build engine/build --config Release

      - name: Unit tests (ctest)
        run: ctest --test-dir engine/build -C Release --output-on-failure

      - name: Assemble dist staging
        shell: pwsh
        run: |
          $d = "dist"
          New-Item -ItemType Directory -Force -Path "$d/scripts" | Out-Null
          Copy-Item engine/build/Release/*.exe $d
          Copy-Item engine/build/Release/*.dll $d
          foreach ($x in 'VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll') {
            Copy-Item "$env:WINDIR/System32/$x" $d -Force
          }
          Copy-Item scripts/*.ps1 "$d/scripts"
          Copy-Item README.md,LICENSE,NOTICE.md,CLAUDE.md $d
          Copy-Item installer/supervisor.vbs,installer/stop-engine.ps1,installer/app.ico $d
          Copy-Item installer/quickstart.txt "$d/QUICKSTART.txt"
          Copy-Item installer/default.conf "$d/virtual-ac3-encoder.conf"

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "virtual-ac3-encoder-${{ steps.ver.outputs.version }}-win64.zip" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            $iscc = if ($cmd) { $cmd.Source } else { "$env:ProgramData\chocolatey\bin\ISCC.exe" }
          }
          $src = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$src" installer/virtual-ac3-encoder.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Upload artifacts (zip + installer)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-ac3-encoder-${{ steps.ver.outputs.version }}
          path: |
            virtual-ac3-encoder-*-win64.zip
            installer/Output/virtual-ac3-encoder-setup-*.exe

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "v$ver"
          $zip = "virtual-ac3-encoder-$ver-win64.zip"
          $exe = "installer/Output/virtual-ac3-encoder-setup-$ver.exe"
          $notes = @"
          **Dolby Control Center** — Real-time multichannel & stereo PCM -> **DTS 5.1** / **Dolby Digital (AC-3) 5.1** / **PCM 2.0** -> IEC 61937 / S-PDIF (Toslink) processor for Windows.
          A software ``Dolby Digital Live`` & ``DTS Connect`` replacement with a DirectX 11 Control Center, 6-channel VU meters, Dynamic Surround 5.1 & Front Stage 3.1 upmixing.

          ## Downloads
          - **virtual-ac3-encoder-setup-$ver.exe** - **Dolby Control Center** installer (per-user, no admin); auto-starts minimized to tray at logon.
          - **$zip** - portable build (extract and run ``control_center.exe`` or ``engine.exe``; see ``QUICKSTART.txt``).

          ## Requires
          A virtual audio cable to capture audio - install **VB-CABLE** (https://vb-audio.com/Cable/) and
          set ``CABLE Input`` as your default playback device, plus an optical output connected to your receiver/soundbar.

          FFmpeg (LGPL) DLLs are bundled; see NOTICE.md for third-party attributions.
          "@
          try {
            gh release create $tag --title "v$ver" --notes $notes $zip $exe
          } catch {
            Write-Warning "Could not publish GitHub release: $_"
          }
          $global:LASTEXITCODE = 0
