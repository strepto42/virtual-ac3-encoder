name: Release

on:
  push:
    branches: [codex/v3-eq-dsp-publish-2026-11-20]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 3.1.0 (defaults to an automatic patch bump)'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish v3 portable release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Determine version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=1" | ConvertFrom-Json
            $latest = ""
            if ($releases -and $releases.Count -gt 0) {
              $latest = $releases[0].tag_name
            }
            if ($latest -match '^v?(\d+)\.(\d+)\.(\d+)') {
              $ver = '{0}.{1}.{2}' -f $Matches[1], $Matches[2], ([int]$Matches[3] + 1)
            } else {
              $ver = '3.0.0'
            }
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $ver"

      - name: Cache FFmpeg development libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build and run unit tests
        shell: pwsh
        env:
          VAC3_VERSION: ${{ steps.ver.outputs.version }}
        run: ./build.ps1 -QtDir "$env:QT_ROOT_DIR" -Version "$env:VAC3_VERSION" -RunTests

      - name: Assemble portable package
        shell: pwsh
        run: |
          $d = 'dist'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Copy-Item 'bin/*' $d -Recurse -Force
          Copy-Item README.md, README-DSP.md, CONTRIBUTING.md, NOTICE.md, LICENSE $d
          Copy-Item docs $d -Recurse -Force

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path 'dist/*' -DestinationPath "virtual-ac3-control-center-${{ steps.ver.outputs.version }}-win64.zip" -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "v$ver"
          $zip = "virtual-ac3-control-center-$ver-win64.zip"
          if (gh release view $tag 2>$null) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }
          $notes = @"
          Virtual AC3 Encoder Control Center v$ver for Windows.

          Includes the Qt control panels, DSP Studio, AC-3/DTS engine, and default DSP presets. See QUICKSTART.txt and the included docs directory for setup and use.

          Requires Windows 10/11 x64 and a compatible S/PDIF output for AC-3/DTS passthrough. See NOTICE.md for third-party license information.
          "@
          gh release create $tag --title "Virtual AC3 Encoder Control Center v$ver" --target "$env:GITHUB_SHA" --notes $notes $zip
