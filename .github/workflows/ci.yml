name: CI

on:
  push:
    branches: [codex/v3-eq-dsp-publish-2026-11-20]
  pull_request:
    branches: [codex/v3-eq-dsp-publish-2026-11-20]
  workflow_dispatch:

jobs:
  build-and-test:
    name: v3 build and unit tests (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Cache FFmpeg development libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Build and run unit tests
        shell: pwsh
        run: ./build.ps1 -QtDir "$env:QT_ROOT_DIR" -RunTests
