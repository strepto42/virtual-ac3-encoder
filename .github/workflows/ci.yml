name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Pushes to main don't run CI here — the Release workflow builds + tests main on merge.

jobs:
  engine:
    name: Engine build + unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # FFmpeg shared dev libs are not committed; cache them across runs.
      - name: Cache FFmpeg dev libs
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Configure (CMake, VS 2022 x64)
        run: cmake -S engine -B engine/build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build engine/build --config Release

      - name: Unit tests (ctest)
        run: ctest --test-dir engine/build -C Release --output-on-failure
        # The doctest suite already encodes PCM -> AC3 and checks the IEC 61937 burst,
        # so the engine/encoder path is covered without needing a system ffmpeg here.
