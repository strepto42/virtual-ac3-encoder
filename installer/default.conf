# Virtual AC3 Encoder configuration.  (Restart the engine, or log off+on, after editing.)

# Capture device: by default, capture directly from CABLE Input (playback device) via loopback:
in=Cable INPUT

# Output: auto-pick the first S/PDIF (optical) output that accepts AC3/DTS:
out_spdif=1

bitrate=640000
loopback=1

# Upmix stereo input to 5.1 (free DTS Neo:PC-style matrix). "surround" (default) or "off":
upmix=surround

# Physical output mode: "ac3" (Dolby Digital 5.1, default), "dts" (DTS 5.1), or "pcm" (stereo PCM):
output_mode=ac3

# DTS bitrate when output_mode=dts: "full" (1536000 bps / 1.5 Mbps, default) or "half" (768000 bps):
dts_rate=full

# Latency preset: "extreme", "fast", "balanced" (default), "safe", or "relaxed"
#   extreme  : lowest possible latency (~3 ms DTS / ~5 ms AC3), for high-end PCs
#   fast     : low latency gaming (~5 ms DTS / ~10 ms AC3)
#   balanced : recommended balance of low latency & stability (~10 ms DTS / ~16 ms AC3)
#   safe     : high compatibility (~16 ms DTS / ~21 ms AC3)
#   relaxed  : maximum safety against dropouts (~32 ms)
latency=balanced

# Custom safe frames buffer override (optional, overrides latency preset if set):
# safe=512
